- aid: dsv:dsv-webhook-api
  name: DSV Webhook API
  description: Subscription API for DSV push notifications covering the Invoice, Visibility, Quote, Tracking,
    Warehousing, Customs and Downtime events. The subscriber supplies a push URL (validated with an OPTIONS
    then POST probe), basic or OAuth callback credentials, and a DSV MDM or WarehouseID customer scope.
    Event names are DSV-proprietary (TrackingShipmentDelivered, TrackingShipmentEstimatedDeliveryChanged,
    TrackingShipmentPodAvailable and similar) rather than DCSA or GS1 EPCIS event types.
  humanURL: https://developer.dsv.com/api-details#api=es-webhook-demo-v1
