aid: dsv
url: https://raw.githubusercontent.com/api-evangelist/dsv/refs/heads/main/apis.yml
name: DSV
kind: company
description: 'DSV A/S is a Danish transport and logistics group headquartered in Hedehusene, Denmark,
  and one of the world''s largest freight forwarders — roughly 150,000 employees across more than 90 countries
  after its 2025 acquisition of Schenker from Deutsche Bahn. It sells air, sea, road, rail and parcel
  forwarding plus contract logistics and customs brokerage, sitting in the intermediation layer between
  shippers and the carriers, terminals and customs authorities it books capacity with. Its API posture
  is a real, publicly browsable Azure API Management developer portal at developer.dsv.com carrying 29
  downloadable OpenAPI 3.0.1 contracts for booking, tracking, quoting, labels, documents, invoicing, customs,
  warehousing and webhooks — but every published product is a DEMO/test environment, production access
  is gated behind myDSV customer credentials and an ''apply to go live'' step, and for a large part of
  DSV''s customer base the real integration path is still EDIFACT D10B, ANSI X12 and DSV XML message packages
  moved over AS2, SFTP or HTTPS. The REST surface is entirely DSV-proprietary: no DCSA, IATA ONE Record,
  Cargo-XML or GS1 EPCIS conformance is claimed anywhere.'
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/groq.png
tags:
- Logistics
- Supply Chain
- Denmark
