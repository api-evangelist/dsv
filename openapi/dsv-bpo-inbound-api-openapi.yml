openapi: 3.2.0
info:
  title: Neom - eDC BPO Inbound API
  description: edc neom API
  version: v2
servers:
- url: https://api.dsv.com/om/neom/v2
security:
- apiKeyHeader: []
- apiKeyQuery: []
tags:
- name: BPO Inbound
paths:
  /Orders/SearchCriteria:
    post:
      tags:
      - BPO Inbound
      summary: 2. Search Order
      description: Search Order
      operationId: POSTapi-public-v2-Orders-SearchCriteria
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        required: true
        schema:
          enum:
          - application/json
          type: string
      - name: Accept
        in: header
        required: true
        schema:
          enum:
          - application/json
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/eDC.Web.Api.v2.Models.SearchRequest'
            example:
              Page: 1
              PageSize: 20
              Criteria: OrderNumber.StartsWith("2020") && !string.IsNullOrEmpty(Booking.BookingNumber)
      responses:
        '200':
          description: Success
  /Orders/{orderNumber}/{splitNo}:
    delete:
      tags:
      - BPO Inbound
      summary: 4. Cancel Order
      description: Cancel Order
      operationId: DELETEapi-public-v2-Orders-orderNumber
      parameters:
      - name: orderNumber
        in: path
        required: true
        schema:
          type: string
      - name: splitNo
        in: path
        description: Format - int64.
        required: true
        schema:
          type: integer
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        required: true
        schema:
          enum:
          - application/json
          type: string
      - name: Accept
        in: header
        required: true
        schema:
          enum:
          - application/json
          type: string
      responses:
        '200':
          description: Success
  /Orders:
