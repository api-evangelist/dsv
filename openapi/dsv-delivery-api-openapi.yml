    DeliveryNotificationItemDto:
      required:
      - warehouseId
      - deliveryId
      - deliveryItems
      type: object
      properties:
        warehouseId:
          maxLength: 20
          minLength: 0
          type: string
          description: To be resolved in token database
          example: a4b11-3a7f06
        deliveryId:
          maxLength: 20
          minLength: 0
          type: string
          description: Unique order name/number/identifier
          example: DI-993
        purchaseOrder:
          maxLength: 25
          minLength: 0
          type: string
          description: Purchase order reference.
          example: PO-0346
        customerOrderReference:
          maxLength: 35
          minLength: 0
          type: string
          description: Reference to the order number of customer.
          example: 777XX
        orderType:
          $ref: '#/components/schemas/OutboundOrderType'
        shipmentDates:
          $ref: '#/components/schemas/ShipmentDatesDto'
        incoterms:
          $ref: '#/components/schemas/IncotermsDto'
        transportDetails:
          $ref: '#/components/schemas/TransportDetailsDeliveryNotificationDto'
        delivery:
          $ref: '#/components/schemas/AddressDto'
        invoice:
          $ref: '#/components/schemas/AddressDto'
        hub:
          $ref: '#/components/schemas/AddressDto'
        deliveryDetails:
          $ref: '#/components/schemas/DeliveryDetailsDto'
        additionalInformation:
          $ref: '#/components/schemas/AdditionalInformationDto'
        outboundNotes:
          type: array
          items:
            $ref: '#/components/schemas/OutboundNoteDto'
          description: Outbound Notes
        deliveryItems:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryItemDto'
          description: Delivery Items
      description: Delivery Notification Item
    NumericFieldDto:
      required:
      - sequence
      type: object
      properties:
        sequence:
          maximum: 4.0
          minimum: 1.0
          type: integer
          description: User Def Num 1-4
          format: int32
          example: 1
        value:
          maximum: 999999999.999999
          minimum: 0.0
          type: number
          description: 'min: 0, max: 999999999.999999 (9.6)'
          example: 999999999.999999
      description: User defined numeric fields
    IncotermsEnum:
      enum:
      - EXW
      - FCA
      - CPT
      - CIP
      - DAP
      - DPU
      - DDP
      - FAS
      - FOB
      - CFR
      - CIF
      - DDU
      type: string
      description: ''
    FieldDTO:
      type: object
      properties:
        name:
          type: string
          description: Error name
          example: field_name
        message:
          type: string
          description: Description of error
          example: validation error
        code:
          type: string
          description: Type of error
          example: ERR12345
    ShipmentDatesDto:
      type: object
      properties:
        orderDate:
          type: string
          description: 'The date/time the order was created as supplied by the customer Format: CCYY-MM-DDTHH:mm:ssZ'
          example: '2025-03-25T14:30:00Z'
        requestedShipDate:
          type: string
          description: 'The date-time the order is due to be shipped to the buyer Format: CCYY-MM-DDTHH:mm:ssZ'
          example: '2025-03-25T14:30:00Z'
        requestedDeliveryDate:
          type: string
          description: 'The date-time the order is due to be delivered to the buyer Format: CCYY-MM-DDTHH:mm:ssZ'
          example: '2025-03-25T14:30:00Z'
      description: Shipment Dates
    ProductValueDto:
      type: object
      properties:
        valueOfProduct:
          maximum: 999999999.999999
          minimum: 0.0
          type: number
          description: Selling price of the lowest track level of the product
          example: 999
        currency:
          $ref: '#/components/schemas/CurrencyCode'
      description: Product Value
    AddressDto:
      type: object
      properties:
        partyId:
          maxLength: 15
          minLength: 0
          type: string
          description: Unique code identifying the address
          example: PId123456
        companyName:
          maxLength: 50
          minLength: 0
          type: string
          description: Company name
          example: DSV
        addressLine1:
          maxLength: 60
          minLength: 0
          type: string
          description: Address line 1.
          example: AddressLine1
        addressLine2:
          maxLength: 60
          minLength: 0
          type: string
          description: Address line 2.
          example: AddressLine2
        city:
          maxLength: 60
          minLength: 0
          type: string
          description: Address town
          example: Copenhagen
        state:
          maxLength: 60
          minLength: 0
          type: string
          description: Address county or state
          example: Capital Region of Denmark
        zipCode:
          maxLength: 20
          minLength: 0
          type: string
          description: Postal Code
          example: '1000'
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        vatNumber:
          maxLength: 20
          minLength: 0
          type: string
          description: Supplier VAT number
          example: '#123456'
        contactName:
          maxLength: 25
          minLength: 0
          type: string
          description: Contact name
          example: Test
        contactPhone:
          maxLength: 25
          minLength: 0
          type: string
          description: Phone number
          example: '+1123456789'
        contactEmail:
          maxLength: 70
          minLength: 0
          type: string
          description: Email
          format: email
          example: test@gmail.com
        contactMobile:
          maxLength: 15
          minLength: 0
          type: string
          description: Mobile number
          example: '+1123456789'
      description: Address
    TextFieldDto:
      required:
      - sequence
      type: object
      properties:
        sequence:
          maximum: 8.0
          minimum: 1.0
          type: integer
          description: User Def Type 1-8
          format: int32
          example: 1
        value:
          maxLength: 30
          minLength: 0
          type: string
          description: Max length 30 characters
          example: Value1
      description: User defined text fields
    AdditionalInformationDto:
      type: object
      properties:
        numericFields:
          type: array
          items:
            $ref: '#/components/schemas/NumericFieldDto'
          description: User defined numeric fields
        textFields:
          type: array
          items:
            $ref: '#/components/schemas/TextFieldDto'
          description: User defined text fields
      description: Additional Information
    ConditionCode:
      enum:
      - OK1
      - OK2
      - DM1
      - DM2
      - HO1
      - HO2
      - QU1
      - QU2
      - RN1
      - RN2
      - SC1
      - SC2
      type: string
      description: ''
    DeliveryDetailsDto:
      type: object
      properties:
        invoiceNumber:
          maxLength: 35
          minLength: 0
          type: string
          description: Invoice Number
          example: Inv-0155
        paymentTerms:
          maxLength: 35
          minLength: 0
          type: string
          description: Payment Terms
          example: EOM
        textOnDocumentsHeader:
          maxLength: 80
          minLength: 0
          type: string
          description: Documentation_Text_1
          example: DocumentsHeader
        textOnDocumentsFooter1:
          maxLength: 80
          minLength: 0
          type: string
          description: Documentation_Text_2
          example: DocumentsFooter1
        textOnDocumentsFooter2:
          maxLength: 80
          minLength: 0
          type: string
          description: Documentation_Text_3
          example: DocumentsFooter2
      description: Delivery Details
    DevelopmentDTO:
      type: object
      properties:
        message:
          type: string
          description: Verbose, plain language description of the problem for the app developer with hints on how to fix it
        exception:
          type: string
          description: Dump from exception
