openapi: 3.2.0
info:
  title: WMS Notification (DEMO) Delivery API
  description: 'Contract Logistics API - WMS Delivery Notification (DEMO) '
  version: v1
servers:
- url: https://api.dsv.com/cl-demo/delivery/v1
security:
- apiKeyHeader: []
- apiKeyQuery: []
tags:
- name: Delivery
paths:
  /deliveryNotification:
    post:
      tags:
      - Delivery
      summary: Create Delivery Notification(s)
      description: Create Delivery Notification Order(s)
      operationId: DeliveryNotification_Post
      parameters:
      - name: api-version
        in: header
        description: api-version
        schema:
          type: string
        example: 1
      - name: Authorization
        in: header
        description: OAuth header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryNotificationDto'
            example:
              deliveryNotification:
              - warehouseId: a4b11-3a7f06
                deliveryId: DI-993
                purchaseOrder: PO-0346
                customerOrderReference: 777XX
                orderType: NORMAL
                shipmentDates:
                  orderDate: '2025-03-25T02:30:00.0000000+00:00'
                  requestedShipDate: '2025-03-25T02:30:00.0000000+00:00'
                  requestedDeliveryDate: '2025-03-25T02:30:00.0000000+00:00'
                incoterms:
                  code: EXW
                  location: Denmark
                transportDetails:
                  carrierName: V1-55
                  carrierMode: CM1-55
                  deliveryPoint: D35A-Noida
                delivery:
                  partyId: PId123456
                  companyName: DSV
                  addressLine1: AddressLine1
                  addressLine2: AddressLine2
                  city: Copenhagen
                  state: Capital Region of Denmark
                  zipCode: '1000'
                  countryCode: AF
                  vatNumber: '#123456'
                  contactName: Test
                  contactPhone: '+1123456789'
                  contactEmail: test@gmail.com
                  contactMobile: '+1123456789'
                invoice:
                  partyId: PId123456
                  companyName: DSV
                  addressLine1: AddressLine1
                  addressLine2: AddressLine2
                  city: Copenhagen
                  state: Capital Region of Denmark
                  zipCode: '1000'
                  countryCode: AF
                  vatNumber: '#123456'
                  contactName: Test
                  contactPhone: '+1123456789'
                  contactEmail: test@gmail.com
                  contactMobile: '+1123456789'
                hub:
                  partyId: PId123456
                  companyName: DSV
                  addressLine1: AddressLine1
                  addressLine2: AddressLine2
                  city: Copenhagen
                  state: Capital Region of Denmark
                  zipCode: '1000'
                  countryCode: AF
                  vatNumber: '#123456'
                  contactName: Test
                  contactPhone: '+1123456789'
                  contactEmail: test@gmail.com
                  contactMobile: '+1123456789'
                deliveryDetails:
                  invoiceNumber: Inv-0155
                  paymentTerms: EOM
                  textOnDocumentsHeader: DocumentsHeader
                  textOnDocumentsFooter1: DocumentsFooter1
                  textOnDocumentsFooter2: DocumentsFooter2
                additionalInformation:
                  numericFields:
                  - sequence: 1
                    value: 999999999.999999
                  textFields:
                  - sequence: 1
                    value: Value1
                outboundNotes:
                - code: C12-055
                  text: txt-055-999438
                deliveryItems:
                - lineId: 55
                  productId: P12-055
                  quantity: 100
                  customerProductId: CP-055
                  conditionOfProduct: OK1
                  lotId: LotId-055
                  expirationDaysLeft: 7
                  serialNumbers:
                  - SN1234567890
                  - SN1234567891
                  customerProductDescription1: CustomerProductDescription1
                  customerProductDescription2: CustomerProductDescription2
                  customerOrderReference: CustomerOrderReference
                  productValue:
                    valueOfProduct: 999
                    currency: AED
                  additionalInformation:
                    numericFields:
                    - sequence: 1
                      value: 999999999.999999
                    textFields:
                    - sequence: 1
                      value: Value1
                  outboundNotes:
                  - code: C12-055
                    text: txt-055-999438
      responses:
        '200':
          description: Success
        '400':
          description: Request contains not valid data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              example:
                code: ERR12345
                message: 'Not found id : 4025988810785188'
                fields:
                - name: field_name
                  message: validation error
                  code: ERR12345
                development:
                  message: string
                  exception: string
        '401':
          description: Not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              example:
                code: ERR12345
                message: 'Not found id : 4025988810785188'
                fields:
                - name: field_name
                  message: validation error
                  code: ERR12345
                development:
                  message: string
                  exception: string
        '403':
          description: Lack of privileges to use this method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              example:
                code: ERR12345
                message: 'Not found id : 4025988810785188'
                fields:
                - name: field_name
                  message: validation error
                  code: ERR12345
                development:
                  message: string
                  exception: string
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              example:
                code: ERR12345
                message: 'Not found id : 4025988810785188'
                fields:
                - name: field_name
                  message: validation error
                  code: ERR12345
                development:
                  message: string
                  exception: string
