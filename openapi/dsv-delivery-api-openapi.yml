    OutboundOrderType:
      enum:
      - NORMAL
      - RUSH
      - SAMPLE
      type: string
      description: ''
    TransportDetailsDeliveryNotificationDto:
      type: object
      properties:
        carrierName:
          maxLength: 25
          minLength: 0
          type: string
          description: Identifier of the carrier company that is to transport the goods
          example: V1-55
        carrierMode:
          maxLength: 40
          minLength: 0
          type: string
          description: Transportation service level name/identifier
          example: CM1-55
        deliveryPoint:
          maxLength: 15
          minLength: 0
          type: string
          description: Drop point at place of delivery
          example: D35A-Noida
      description: Transport Details
    OutboundNoteDto:
      type: object
      properties:
        code:
          maxLength: 20
          minLength: 0
          type: string
          description: Code
          example: C12-055
        text:
          maxLength: 180
          minLength: 0
          type: string
          description: Text
          example: txt-055-999438
      description: Outbound Note
    ErrorDTO:
      required:
      - code
      - message
      type: object
      properties:
        code:
          minLength: 1
          type: string
          description: Unique error code
          example: ERR12345
        message:
          minLength: 1
          type: string
          description: Error message passed to the user
          example: 'Not found id : 4025988810785188'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDTO'
        development:
          $ref: '#/components/schemas/DevelopmentDTO'
    IncotermsDto:
      required:
      - code
      - location
      type: object
      properties:
        code:
          $ref: '#/components/schemas/IncotermsEnum'
        location:
          maxLength: 60
          minLength: 0
          type: string
          description: Place related to Terms of Delivery (Incoterms)
          example: Denmark
      description: Incoterms
    DeliveryNotificationDto:
      type: object
      properties:
        deliveryNotification:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryNotificationItemDto'
          description: Delivery Notification
      description: Delivery Notification
    DeliveryItemDto:
      required:
      - lineId
      - productId
      - quantity
      type: object
      properties:
        lineId:
          maximum: 999999.0
          minimum: 0.0
          type: integer
          description: Line identifier
          format: int32
          example: 55
        productId:
          maxLength: 50
          minLength: 0
          type: string
          description: Stock Keeping Unit identifier
          example: P12-055
        quantity:
          maximum: 999999999.0
          minimum: 0.0
          type: integer
          description: Number of units that has been ordered
          format: int32
          example: 100
        customerProductId:
          maxLength: 30
          minLength: 0
          type: string
          description: Stock Keeping Unit identifier used by the customer/retailer
          example: CP-055
        conditionOfProduct:
          $ref: '#/components/schemas/ConditionCode'
        lotId:
          maxLength: 15
          minLength: 0
          type: string
          description: If specific Batch Id / Lot Id are to be sent. Max 15 chars
          example: LotId-055
        expirationDaysLeft:
          maximum: 99999.0
          minimum: 0.0
          type: integer
          description: Format '99999' Number of days before expiration.
          format: int32
          example: 7
        serialNumbers:
          type: array
          items:
            type: string
          description: Segment can only be used if flag on productData productHoldsSerialNumber is set
          example:
          - SN1234567890
          - SN1234567891
        customerProductDescription1:
          maxLength: 40
          minLength: 0
          type: string
          description: SKU description as printed on documents
          example: CustomerProductDescription1
        customerProductDescription2:
          maxLength: 40
          minLength: 0
          type: string
          description: SKU description as printed on documents
          example: CustomerProductDescription2
        customerOrderReference:
          maxLength: 25
          minLength: 0
          type: string
          description: Purchase order reference
          example: CustomerOrderReference
        productValue:
          $ref: '#/components/schemas/ProductValueDto'
        additionalInformation:
          $ref: '#/components/schemas/AdditionalInformationDto'
        outboundNotes:
          type: array
          items:
            $ref: '#/components/schemas/OutboundNoteDto'
          description: Outbound Notes
      description: Delivery Item
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      name: DSV-Subscription-Key
      in: header
    apiKeyQuery:
      type: apiKey
      name: DSV-Subscription-Key
      in: query
