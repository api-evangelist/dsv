    ProductDto:
      required:
      - warehouseId
      - productId
      - productValue
      - productDescription
      type: object
      properties:
        warehouseId:
          maxLength: 20
          minLength: 0
          type: string
          description: To be resolved in Token database
          example: 36643f9b7c1c48ef
        productId:
          maxLength: 50
          minLength: 0
          type: string
          description: Unique identifier of the Stock Keeping Unit (product)
          example: '11112222'
        commodityCode:
          maxLength: 22
          minLength: 0
          type: string
          description: Commodity code
          example: '1023456789'
        commodityDescription:
          maxLength: 35
          minLength: 0
          type: string
          description: Commodity description
          example: '1543234567'
        productAttributes:
          $ref: '#/components/schemas/ProductAttributesDto'
        productDimensions:
          $ref: '#/components/schemas/ProductDimensionsDto'
        productValue:
          $ref: '#/components/schemas/ProductValueDto'
        additionalProductAttributes:
          $ref: '#/components/schemas/AdditionalProductAttributesDto'
        additionalInformation:
          $ref: '#/components/schemas/AdditionalInformationDto'
        productDescription:
          type: array
          items:
            $ref: '#/components/schemas/ProductDescriptionDto'
          description: Prodect Descriptions
        productStackConfiguration:
          type: array
          items:
            $ref: '#/components/schemas/ProductStackConfigurationDto'
          description: Product Stack Configuration
      description: Product
    DimensionUOM:
      enum:
      - MMT
      - CMT
      - DMT
      - MTR
      - INH
      - FOT
      type: string
      description: ''
    ErrorDTO:
      required:
      - code
      - message
      type: object
      properties:
        code:
          minLength: 1
          type: string
          description: Unique error code
          example: ERR12345
        message:
          minLength: 1
          type: string
          description: Error message passed to the user
          example: 'Not found id : 4025988810785188'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDTO'
        development:
          $ref: '#/components/schemas/DevelopmentDTO'
    ProductUOM:
      enum:
      - EACH
      - INNERBOX
      - BOX
      - OUTERBOX
      - LAYER
      - PALLET
      - METERS
      - ROLLS
      - LITER
      - DRUMS
      - CRATE
      - BOTTLE
