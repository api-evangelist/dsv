openapi: 3.2.0
info:
  title: WMS (DEMO) Product Data API
  description: Contract Logistics API - WMS Product Data (DEMO)
  version: v1
servers:
- url: https://api.dsv.com/cl-demo/productdata/v1
security:
- apiKeyHeader: []
- apiKeyQuery: []
tags:
- name: ProductData
paths:
  /productData:
    post:
      tags:
      - ProductData
      summary: Create new Product Data record(s)
      description: Create new Product Data records with full product information via API
      operationId: ProductData_Post
      parameters:
      - name: api-version
        in: header
        description: api-version
        schema:
          type: string
        example: 1
      - name: Authorization
        in: header
        description: OAuth header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDataDto'
            example:
              products:
              - warehouseId: 36643f9b7c1c48ef
                productId: '11112222'
                commodityCode: '1023456789'
                commodityDescription: '1543234567'
                productAttributes:
                  productGroup: Product
                  productSize: Size1
                  hazmatId: '1234'
                  style: '1234'
                  gender: F
                  colour: Blue
                  ean: '12345678901234'
                  upc: '12345678901234'
                productDimensions:
                  weight: 9999999.999999
                  weightUOM: GRM
                  volume: 9999999.999999
                  volumeUOM: MMQ
                  height: 9999.999
                  width: 9999.999
                  depth: 9999.999
                  dimensionUOM: MMT
                productValue:
                  valueOfProduct: 999
                  currency: AED
                additionalProductAttributes:
                  productLotControlled: true
                  productExpirationDateControlled: false
                  productHoldsSerialNumber: true
                  additionalProductId: PRD12345678
                  additionalProductDescription: AdditionalProductDescription
                additionalInformation:
                  numericFields:
                  - sequence: 1
                    value: 999999999.999999
                  textFields:
                  - sequence: 1
                    value: Value1
                productDescription:
                - language: AF_ZA
                  description: Product description
                productStackConfiguration:
                - productUOM: EACH
                  quantityInUOM: 999999
                  weight: 9999999.999999
                  weightUOM: GRM
                  volume: 9999999.999999
                  volumeUOM: MMQ
                  height: 9999.999
                  width: 9999.999
                  depth: 9999.999
                  dimensionUOM: MMT
      responses:
        '200':
          description: Success/Failure Status
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              example:
                code: ERR12345
                message: 'Not found id : 4025988810785188'
                fields:
                - name: field_name
                  message: validation error
                  code: ERR12345
                development:
                  message: string
                  exception: string
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              example:
                code: ERR12345
                message: 'Not found id : 4025988810785188'
                fields:
                - name: field_name
                  message: validation error
                  code: ERR12345
                development:
                  message: string
                  exception: string
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              example:
                code: ERR12345
                message: 'Not found id : 4025988810785188'
                fields:
                - name: field_name
                  message: validation error
                  code: ERR12345
                development:
                  message: string
                  exception: string
    put:
      tags:
      - ProductData
      summary: Update Product Data record(s)
      description: Request used to update previously created product data records.
      operationId: ProductData_Put
      parameters:
      - name: api-version
        in: header
        description: api-version
        schema:
          type: string
        example: 1
      - name: Authorization
        in: header
        description: OAuth header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDataDto'
            example:
              products:
              - warehouseId: 36643f9b7c1c48ef
                productId: '11112222'
                commodityCode: '1023456789'
                commodityDescription: '1543234567'
                productAttributes:
                  productGroup: Product
                  productSize: Size1
                  hazmatId: '1234'
                  style: '1234'
                  gender: F
                  colour: Blue
                  ean: '12345678901234'
                  upc: '12345678901234'
                productDimensions:
                  weight: 9999999.999999
                  weightUOM: GRM
                  volume: 9999999.999999
                  volumeUOM: MMQ
                  height: 9999.999
                  width: 9999.999
                  depth: 9999.999
                  dimensionUOM: MMT
                productValue:
                  valueOfProduct: 999
                  currency: AED
                additionalProductAttributes:
                  productLotControlled: true
                  productExpirationDateControlled: false
                  productHoldsSerialNumber: true
                  additionalProductId: PRD12345678
                  additionalProductDescription: AdditionalProductDescription
                additionalInformation:
                  numericFields:
                  - sequence: 1
                    value: 999999999.999999
                  textFields:
                  - sequence: 1
                    value: Value1
                productDescription:
                - language: AF_ZA
                  description: Product description
                productStackConfiguration:
                - productUOM: EACH
                  quantityInUOM: 999999
                  weight: 9999999.999999
                  weightUOM: GRM
                  volume: 9999999.999999
                  volumeUOM: MMQ
                  height: 9999.999
                  width: 9999.999
                  depth: 9999.999
                  dimensionUOM: MMT
      responses:
        '200':
          description: Success/Failure Status
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              example:
                code: ERR12345
                message: 'Not found id : 4025988810785188'
                fields:
                - name: field_name
                  message: validation error
                  code: ERR12345
                development:
                  message: string
                  exception: string
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              example:
                code: ERR12345
                message: 'Not found id : 4025988810785188'
                fields:
                - name: field_name
                  message: validation error
                  code: ERR12345
                development:
                  message: string
                  exception: string
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              example:
                code: ERR12345
                message: 'Not found id : 4025988810785188'
                fields:
                - name: field_name
                  message: validation error
                  code: ERR12345
                development:
                  message: string
                  exception: string
