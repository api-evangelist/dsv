    VolumeUOM:
      enum:
      - MMQ
      - CMQ
      - DMQ
      - MTQ
      - INQ
      - FTQ
      type: string
      description: ''
    NumericFieldDto:
      required:
      - sequence
      type: object
      properties:
        sequence:
          maximum: 4.0
          minimum: 1.0
          type: integer
          description: User Def Num 1-4
          format: int32
          example: 1
        value:
          maximum: 999999999.999999
          minimum: 0.0
          type: number
          description: 'min: 0, max: 999999999.999999 (9.6)'
          example: 999999999.999999
      description: User defined numeric fields
    FieldDTO:
      type: object
      properties:
        name:
          type: string
          description: Error name
          example: field_name
        message:
          type: string
          description: Description of error
          example: validation error
        code:
          type: string
          description: Type of error
          example: ERR12345
    ProductStackConfigurationDto:
      type: object
      properties:
        productUOM:
          $ref: '#/components/schemas/ProductUOM'
        quantityInUOM:
          maximum: 999999.0
          minimum: 0.0
          type: integer
          description: 'If productUOM is ''EACH'', quantityInUOM must be set to 1 (min: 0, max: 999999 (6.0))'
          format: int32
          example: 999999
        weight:
          maximum: 9999999.999999
          minimum: 0.0
          type: number
          description: 'Weight of the second track level of the product - default Uom is kilograms. [min: 0, max: 9999999.999999 (7.6)]'
          example: 9999999.999999
        weightUOM:
          $ref: '#/components/schemas/WeightUOM'
        volume:
          maximum: 9999999.999999
          minimum: 0.0
          type: number
          description: 'Volume of the second track level of the product - default Uom is cubic meter. [min: 0, max: 9999999.999999 (7.6)]'
          example: 9999999.999999
        volumeUOM:
          $ref: '#/components/schemas/VolumeUOM'
        height:
          maximum: 9999.999
          minimum: 0.0
          type: number
          description: 'Height of the second track level of the product - default Uom is meters. [min: 0, max: 9999.999 (4.3)]'
          example: 9999.999
        width:
          maximum: 9999.999
          minimum: 0.0
          type: number
          description: 'Width of the second track level of the product - default Uom is meters. [min: 0, max: 9999.999 (4.3)]'
          example: 9999.999
        depth:
          maximum: 9999.999
          minimum: 0.0
          type: number
          description: 'Depth (length) of the second track level of the product - default Uom is meters. [min: 0, max: 9999.999 (4.3)]'
          example: 9999.999
        dimensionUOM:
          $ref: '#/components/schemas/DimensionUOM'
      description: Product Stack Configuration
    ProductDimensionsDto:
      type: object
      properties:
        weight:
          maximum: 9999999.999999
          minimum: 0.0
          type: number
          description: 'Weight of the lowest track level of the product - default Uom is kilograms. [min: 0, max: 9999999.999999 (7.6)]'
          example: 9999999.999999
        weightUOM:
          $ref: '#/components/schemas/WeightUOM'
        volume:
          maximum: 9999999.999999
          minimum: 0.0
          type: number
          description: 'Volume of the lowest track level of the product - default Uom is cubic meter. min: 0, max: 9999999.999999 (7.6)'
          example: 9999999.999999
        volumeUOM:
          $ref: '#/components/schemas/VolumeUOM'
        height:
          maximum: 9999.999
          minimum: 0.0
          type: number
          description: 'Height of the lowest track level of the product - default Uom is meters. [min: 0, max: 9999.999 (4.3)]'
          example: 9999.999
        width:
          maximum: 9999.999
          minimum: 0.0
          type: number
          description: 'Width of the lowest track level of the product - default Uom is meters. [min: 0, max: 9999.999 (4.3)]'
          example: 9999.999
        depth:
          maximum: 9999.999
          minimum: 0.0
          type: number
          description: Depth (length) of the lowest track level of the product - default Uom is meters
          example: 9999.999
        dimensionUOM:
          $ref: '#/components/schemas/DimensionUOM'
      description: Product Dimensions
    ProductValueDto:
      type: object
      properties:
        valueOfProduct:
          maximum: 999999999.999999
          minimum: 0.0
          type: number
          description: Selling price of the lowest track level of the product
          example: 999
        currency:
          $ref: '#/components/schemas/CurrencyCode'
      description: Product Value
    TextFieldDto:
      required:
      - sequence
      type: object
      properties:
        sequence:
          maximum: 8.0
          minimum: 1.0
          type: integer
          description: User Def Type 1-8
          format: int32
          example: 1
        value:
          maxLength: 30
          minLength: 0
          type: string
          description: Max length 30 characters
          example: Value1
      description: User defined text fields
    AdditionalInformationDto:
      type: object
      properties:
        numericFields:
          type: array
          items:
            $ref: '#/components/schemas/NumericFieldDto'
          description: User defined numeric fields
        textFields:
          type: array
          items:
            $ref: '#/components/schemas/TextFieldDto'
          description: User defined text fields
      description: Additional Information
    ProductAttributesDto:
      type: object
      properties:
        productGroup:
          maxLength: 10
          minLength: 0
          type: string
          description: Name to identify if the product belongs to a group of similiar products
          example: Product
        productSize:
          maxLength: 10
          minLength: 0
          type: string
          description: Short description of the size of the product
          example: Size1
        hazmatId:
          maxLength: 4
          minLength: 0
          type: string
          description: Four digit UN number of the hazardous material - only allowed if hazardous material product
          example: '1234'
        style:
          maxLength: 10
          minLength: 0
          type: string
          description: Clothes style (free text)
          example: '1234'
        gender:
          $ref: '#/components/schemas/Gender'
        colour:
          maxLength: 20
          minLength: 0
          type: string
          description: Short description of the colour of the product
          example: Blue
        ean:
          maxLength: 14
          minLength: 0
          type: string
          description: European Article Number of the lowest track level of the product
          example: '12345678901234'
        upc:
          maxLength: 14
          minLength: 0
          type: string
          description: Universal Product Code of the lowest track level of the product
          example: '12345678901234'
      description: Product Attributes
    ProductDescriptionDto:
      required:
      - description
      type: object
      properties:
        language:
          $ref: '#/components/schemas/CombinedLanguageCode'
        description:
          maxLength: 80
          minLength: 0
          type: string
          description: Product description
          example: Product description
      description: ' Product Description'
    ProductDataDto:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductDto'
          description: Products Details
      description: ' Product Data'
    AdditionalProductAttributesDto:
      type: object
      properties:
        productLotControlled:
          type: boolean
          description: Batch controlled Product "true - Yes / false - No"
          example: true
        productExpirationDateControlled:
          type: boolean
          description: Expiry Date controlled Product "true - Yes / false - No"
          example: false
        productHoldsSerialNumber:
          type: boolean
          description: Serial number captured required for Product "true - Yes / false - No"
          example: true
        additionalProductId:
          maxLength: 50
          minLength: 0
          type: string
          description: Additional Product Id
          example: PRD12345678
        additionalProductDescription:
          maxLength: 250
          minLength: 0
          type: string
          description: Additional Product Description
          example: AdditionalProductDescription
      description: Additional Product Attributes
    Gender:
      enum:
      - F
      - M
      type: string
      description: ''
    DevelopmentDTO:
      type: object
      properties:
        message:
          type: string
          description: Verbose, plain language description of the problem for the app developer with hints on how to fix it
