components:
  schemas:
    TransportApiDto:
      type: object
      properties:
        houseBillNumber:
          type: string
          description: Identification of the Bill of Lading issued by DSV to the customer
        masterBillNumber:
          type: string
          description: Identification of the Bill of Lading issued by the carrier to DSV
        awb:
          type: string
          description: Air Waybill Number used by the underlying express carrier
        originName:
          type: string
          description: Name of the first departure port/airport
        originCode:
          type: string
          description: UN location code of the first departure port/airport
        destinationName:
          type: string
          description: Name of the last arrival port/airport
        destinationCode:
          type: string
          description: UN location code of the last arrival port/airport
        scac:
          type: string
          description: The Standard Carrier Alpha Code, or SCAC Code, is a two to four-letter code used to identify vessel operating common carriers (VOCC)
        carrierBookingRef:
          type: string
          description: Booking references from the carrier
      description: This section carries the information about the main transport and some directly associated parameters applicable for "Air", "Sea", "Rail" shipments.
    IncotermsDTO:
      type: object
      properties:
        code:
          type: string
          description: Incoterms® Code according to Incoterms® 2020 standard
        location:
          type: string
          description: The location element specified as the collection/delivery
      description: Incoterms® describe the rights and obligations applicable between the buyer and seller of the goods being transported. They set out when transfer of liability and control take place, who pays for what and who is liable in the event of any damage or loss of goods in transit. For more information check the Incoterms® Information on https://www.dsv.com/en/insights/expert-opinions/what-are-incoterms
    EventApiDto:
      required:
      - cancelled
      type: object
      properties:
        eventDate:
          type: string
          description: 'The date/time of the event at the location the event took place. Format: 2020-07-13T22:00:00.000+0000'
          format: date-time
        eventLastModified:
          type: string
          description: 'The date/time of when event was last modified. Format: 2020-07-13T22:00:00.000+0000'
          format: date-time
        eventGroup:
          type: string
          description: 'Name of event group:

            - Booking - Group for events related to the booking

            - Pickup - Group for events related to the pick up for Road shipments

            - Pickup / Received - Group for events related to the pick up or received for Air and Sea Shipments

            - Main transport - Group for events related to multi-leg shipments

            - Import Customs - Group for events related to import customs

            - Export customs - Group for events related to import customs

            - Delivery - Group for events related to the delivery'
        eventCode:
          type: string
          description: 'Event code as provided by the Transport Management System:

            - ACT - Set shipment to active

            - ATC - Attach to Console

            - ARV - Actual arrival (last port/airport)

            - BOOKING - Booking

            - CANCEL - Cancelled

            - CLR - Customs cleared

            - DCF - Actual delivery

            - DEP - Actual departure (first port/airport)

            - DLV - Container delivered

            - ESTIMATED_DELIVERY - Estimated delivery

            - ESTIMATED_PICKUP - Estimated pickup

            - ETA - Estimated arrival (last port/airport)

            - ETD - Estimated departure (first port/airport)

            - FLO - Freight loaded

            - FUL - Freight unloaded

            - GIC - Arrived at warehouse

            - GIN - Gate In

            - GOC - Departure at warehouse

            - GOU - Gate Out

            - HPD - Held in depot

            - IGC - Trailer arrived at collection address

            - IGD - Trailer arrived at delivery address

            - INA - Set shipment to inactive

            - IRP - Cargo received

            - NCE - No pickup at customer

            - NDE - Not delivered at customer

            - OFD - Out for delivery

            - PCF - Actual pickup

            - PUP - Container picked up

            - REQUESTED_DELIVERY - Requested delivery

            - REQUESTED_PICKUP - Requested pickup

            - Z70 - Handover responsibility of cargo

            - Z71 - Customs reported

            - Z73 - Handover of cargo

            - Z74 - Handover of documents

            - RTC - Receipt Commenced

            - CAV - Cargo Available

            - Z72 - Customs Hold

            - DOR - Delivery Order Received

            - CCC - Customs Commenced

            - DDI (POD) - Document Imported - POD

            - DDI (CUI) - Clearance Instructions Received

            - ECM - Export Customs Commenced

            - ECC - Export Customs Cleared'
        eventDescription:
          type: string
          description: Description of the event code
        eventType:
          type: string
          description: "The associated element of this event:\n- SHIPMENT -  DSV Shipment level event, \n- CONTAINER - Container level event (only \"Sea\" and \"Rail\" shipments), \n- COLLI - Package level event (only \"Road\" shipments)"
        eventTypeValue:
          type: string
          description: ID of the shipment, container or package
        location:
          $ref: '#/components/schemas/LocationApiDto'
        transportMode:
          type: string
          description: Mode of transport in case of multi-leg transport
        vesselName:
          type: string
          description: Vessel name in case of multi-leg transport
        voyageFlightNo:
          type: string
          description: Flight or vessel ID in case of multi-leg transport
        cargoCutOff:
          type: string
          description: Cut off date and time of when the shipment must be ready in the port
          format: date-time
        cargoAvailability:
          type: string
          description: Cargo availability date
          format: date-time
        cancelled:
          type: boolean
          description: Indicates if the event has been cancelled
        docsDue:
          type: string
          description: Documents due deadline
          format: date-time
        vgmCutOff:
          type: string
          description: The date and time when the verified gross mass check must be completed
          format: date-time
      description: Track and trace events
    CustomsApiDto:
      required:
      - entryNumber
      type: object
      properties:
        shippedOnboardDate:
          type: string
          description: Date when the cargo was loaded on the Vessel at the Port of Loading mentioned on the Bill of Lading
        customsStatus:
          type: string
          description: "Customs status:\n- CLR - Import customs cleared\n- Z72 - Customs hold\n- CCC - Import customs commenced\n- ECC - Export customs cleared\n - ECM - Export customs commenced"
        entryNumber:
          type: array
          items:
            type: string
            description: Customs Entry reference given by Customs authority in the local customs process
          description: Customs Entry reference given by Customs authority in the local customs process
        forwarder:
          $ref: '#/components/schemas/BaseParty'
        removalMode:
          type: string
          description: Mode of transport for a transit into another country
      description: Customs data
    FieldDTO:
      type: object
      properties:
        name:
          type: string
          description: Error name
          example: field_name
        message:
          type: string
          description: Description of error
          example: validation error
        code:
          type: string
          description: Type of error
          example: ERR12345
      description: Field
    Pickup:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        contact:
          $ref: '#/components/schemas/ContactPerson'
      description: Name and address of the party shipment is picked up.
    Party:
      required:
      - role
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        contact:
          $ref: '#/components/schemas/ContactPerson'
        role:
          type: string
          description: Business role of the party
      description: Reserved for future use.
    ProductApiDto:
      required:
      - name
      type: object
      properties:
        name:
          enum:
          - Road
          - Air
          - Sea
          - Rail
          - Xpress
          type: string
          description: Main transport mode selection
          example: Sea
        billOfLading:
          enum:
          - Express
          - Original
          type: string
          description: 'Select the Bill of Lading type.

            Only available if product is "Sea".'
          example: Original
        containerMode:
          enum:
          - LCL
          - FCL
          type: string
          description: 'Container mode:

            - FCL: full container load

            - LCL: less than container load


            Only available for product "Sea" and "Rail".'
          example: FCL
        containers:
          type: array
          items:
            $ref: '#/components/schemas/Container'
          description: This section is only available for the products “Sea” and “Rail” when the Container mode is “FCL”. It is used to specify the required containers of a certain type. Additional attributes can be submitted for certain container types. More details on container types can be found at [link].
          xml:
            wrapped: true
        dropOff:
          type: boolean
          description: "Pickup mode:\n- false = Pickup by DSV, \n- true = Cargo handover to DSV at Warehouse or Terminal\n\n(dropOff becomes mandatory when “dropOff” service is available in Shippers country and product is either “AIR”, “SEA” or “RAIL”)"
          example: false
        handover:
          type: boolean
          description: 'Delivery mode:

            - false = Delivery by DSV

            - true = Cargo handover by DSV


            (handover becomes mandatory when "handover" service is available in Shippers country and product is either "AIR", "SEA" or "RAIL")'
          example: false
        subModeOfTransport:
          enum:
          - FAS
          - FSA
          type: string
          description: 'Sub-mode of shipment transport:

            - FSA = First sea then air

            - FAS = First air then sea'
          example: FAS
      description: The product section carries the information about the main transport mode and some directly associated parameters, if any.
    DateTimeSection:
      type: object
      properties:
        pickupTime:
          $ref: '#/components/schemas/DateTimeRange'
        deliveryTime:
          $ref: '#/components/schemas/DateTimeRange'
      description: Date and time specification for the shipment
    TypeValueDTO:
      type: object
      properties:
        type:
          type: string
          description: 'Type of reference: <ul><li>INVOICING_REFERENCE</li><li>ORDER_NUMBER</li><li>CONSIGNEE_REFERENCE</li><li>SHIPPER_REFERENCE</li><li>CUSTOMS_REFERENCE</li><li>OTHER</li><li>ROUTING</li></ul>'
        value:
          type: string
          description: Reference value
      description: References that can be used to identify linked information. It is allowed to send several references of the same reference type.
    FreightPayer:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        contact:
          $ref: '#/components/schemas/ContactPerson'
      description: Name and address of the party that receives the freight invoice.
    Notify:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        contact:
          $ref: '#/components/schemas/ContactPerson'
      description: Name and address of the party who will be notified
    Sender:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        contact:
          $ref: '#/components/schemas/ContactPerson'
      description: 'Name and address of the party sending the goods (shipper).

        If address is not already available, it will be created from supplied address data.'
    BaseParty:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        contact:
          $ref: '#/components/schemas/ContactPerson'
      description: The forwarder responsible for the transport
    DangerousGoodsDTO:
      type: object
      properties:
        className:
          type: string
          description: 'The UN className can be derived from the mandatory unCode.

            If this value is supplied, it will match the UN className that is stored for the unCode.'
        subRisk:
          type: string
          description: 'The UN subRisk can be derived from the mandatory unCode.

            If this value is supplied, it will match the UN subRisk that is stored for the unCode.'
        flashPoint:
          type: number
          description: 'The flashPoint will be provided in the "Unit of Measure" selected for temperature in the units object.

            This can only be used for dangerous goods type = "IMDG".

            This value can be mandatory depending on the UN code.'
        limitedQuantity:
          type: boolean
          description: This value can be mandatory depending on the UN code.
        marinePollutant:
          type: boolean
          description: This value can be mandatory depending on the UN code.
        packingGroup:
          type: string
          description: This value can be mandatory depending on the UN code.
        properShippingName:
          type: string
          description: 'The UN properShippingName can be derived from the mandatory unCode.

            If this value is supplied, it will match the UN properShippingName that is stored for the provided unCode.'
        technicalName:
          type: string
          description: This value can be mandatory depending on the UN code.
        technicalNameNational:
          type: string
          description: This value can be mandatory depending on the UN code.
        temperatureFrom:
          type: number
          description: This value can be mandatory depending on the UN code.
        temperatureTo:
          type: number
          description: This value can be mandatory depending on the UN code.
        type:
          type: string
          description: 'Classification type used for the declaration

            - ADR = According to "Agreement concerning the International Carriage of Dangerous Goods by Road".

            - IMDG = According to "International Maritime Dangerous Goods Code".

            - IATA = According to "International Air Transport Association (IATA) Dangerous Goods Regulations (DGR)"'
        unCode:
          type: integer
          description: The UN code identifying the Dangerous Goods.
          format: int32
        tunnelCode:
          type: string
          description: This value can be mandatory depending on the UN code.
        packagesCount:
          type: integer
          description: Number of Packages containing these dangerous goods
          format: int32
        packingKind:
          enum:
          - BAG
          - BOX
          - CAN
          - DRUM
          - IBC
          - JERRY
          - CP
          - LGM
          - BOB
          - PD
          - SB
          - DRM
          - JCN
          type: string
          description: 'Package type containing these dangerous goods. Possible values are:

            - BAG - Bag

            - BOX - Carton / Box

            - IBC - Intermediate Bulk Container

            - CP - Composite Packaging

            - LGM - Light Gauge Metal Packaging

            - BOB - Bundle of Bottles

            - PD - Pressure Drum

            - SB - Steel Bottle

            - DRM - Drum

            - JCN - Jerry Can'
        netQuantity:
          type: number
          description: Net quantity of the dangerous goods
        netQuantityUnit:
          enum:
          - KG
          - M3
          - DM3
          - CM
          - M
          - LM
          - LTR
          - C
          - LB
          - FT3
          - IN
          - FT
          - F
          type: string
          description: Quantity unit of the dangerous goods
        grossQuantity:
          type: number
          description: Gross quantity of the dangerous goods
        grossQuantityUnit:
          enum:
          - KG
          - M3
          - DM3
          - CM
          - M
          - LM
          - LTR
          - C
          - LB
          - FT3
          - IN
          - FT
          - F
          type: string
          description: Quantity unit of the dangerous goods
        empty:
          type: boolean
          description: True / False
      description: This section contains the details of the dangerous goods in the booking/shipment.
    LocationApiDto:
      type: object
      properties:
        countryCode:
          type: string
          description: 2 letter ISO country code (e.g. US)
        unlocode:
          type: string
          description: UN/LOCODE
        place:
          type: string
          description: Associated location name
      description: Event location details
    LocalTime:
      type: object
      properties:
        hour:
          type: integer
          format: int32
        minute:
          type: integer
          format: int32
        second:
          type: integer
          format: int32
        nano:
          type: integer
          format: int32
      description: The requested pickup/delivery time (end of time window) using the 24 hours format hh:mm:ss
      example: '14:15:00'
    DocumentDto:
      required:
      - documentId
      - documentType
      - downloadUrl
      - fileName
      - fileType
      - typeDescription
      type: object
      properties:
        documentId:
          type: string
          description: Document ID
        documentType:
          type: string
          description: "Proof of delivery (POD), \nCommercial Invoice, \nOther goods documents, \nCustoms declaration, \nDangerous goods documents, \nPacking list, \nHouse bill of lading"
        typeDescription:
          type: string
          description: Description of the document type
        createDate:
          type: string
          description: Date of creation
          format: date-time
        fileName:
          type: string
          description: File name
        fileType:
          type: string
          description: File type
        downloadUrl:
          type: string
          description: URL for file download
      description: This section contains all document details of Profs of delivery.
    Carrier:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        contact:
          $ref: '#/components/schemas/ContactPerson'
      description: Name and address of the carrier
    IssueAPI:
      type: object
      properties:
        issueDate:
          type: string
          description: Date when the issue has occurred (or spotted)
          format: date-time
        issuePointCode:
          type: string
          description: 'Place code where the issue occurred:

            - PRODPLAN - Production Planning

            - PROD - Production

            - POST - Post-Delivery

            - PIC - Origin/Pick up

            - TRAN - Main transport

            - DEL - Destination/Delivery

            - BOOK - Booking'
        issuePointDescription:
          type: string
          description: Place where the issue occurred
        issuePartyCode:
          type: string
          description: 'Party code who caused the issue:- TERMIN - Terminal

            - SHPR - Shipper

            - SUP - Pickup From/Supplier

            - HAUL - Haulier/Trucker

            - FM - Force Majeure

            - DSV - DSV

            - DELV - Deliver To

            - CUS - Consignee/Buyer

            - CAR - Carrier

            - BRO - Broker

            - AUT - Authorities

            - 3PARTY - 3rd Party'
        issuePartyDescription:
          type: string
          description: Party who caused the issue
        issueTypeCode:
          type: string
          description: 'Coded categorization of the issue:- UND - Underload

            - SAFETY - Safety

            - PRDQU - Product Quality

            - PRDAV - Product Availability

            - OVR - Overload

            - MISSING - Missing

            - LATE - Late

            - INV - Invoicing

            - EARLY - Early

            - DOC - Documentation / Administration

            - DMG - Damage (use notes for detailed information)

            - OTH - Other

            - TMP - Temperature

            - QRTO - Quarantine Open

            - QRTC - Quarantine Closed'
        issueTypeDescription:
          type: string
          description: Categorization of the issue
        issueReasonCode:
          type: string
          description: 'Coded reason why the issue occurred:- ACC - Accident, Theft and Vandalism

            - BANK - Bank Holiday

            - COM - Communication/Incorrect Instructions

            - COST - Cost Approval

            - DEST - DSV Destination Process/Query

            - DOCS - Document(s)

            - ECOND - Equipment Condition/Type

            - EQU - Equipment Breakdown

            - HUM - Human Error/Incorrect Handling

            - IMPROP - Improper Packaging/Labeling

            - INS - Inspection / Excessive Customs Process

            - IT - IT

            - LACKEQ - Lack of Equipment

            - LATEINS - Late Instruction/Communication

            - MISROUTE - Change in Schedule/Misrouting

            - NON - Non Availability

            - ORIG - DSV Origin Process/Query

            - PROD - Faulty product

            - PST - Postponed

            - RAW - Lack of raw material

            - REJECT - Rejection

            - RSC - Resources

            - SLP - Sales process

            - SOP - Operating Procedure

            - SPOT - None Contractual Shipment/Spot Shipment

            - STR - Strike

            - TRF - Traffic

            - TTNOT - Agreed Transittime Not Achievable

            - UNS - Unsafe Conditions

            - UPR - Upon Request

            - WAR - War

            - WTH - Weather/Nature'
        issueReasonDescription:
          type: string
          description: Reason why the issue occurred
        issueNotes:
          type: string
          description: Additional information about the issue (max 100 characters)
        issueResolved:
          type: string
          description: Date when the issue was resolved
          format: date-time
      description: This section contains Issues details from the booking/shipment.
