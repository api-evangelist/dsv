  /bookings/uploadDocument:
    post:
      tags:
      - Booking
      summary: 2. Upload documents to draft booking (Deprecated)
      description: '<strong>Deprecated</strong> Please use /bookings/uploadDocument/{shipmentId}<br> Upload transport related documents (e.g. packing list, dangerous goods certificates, commercial invoice etc.).<br> <i>Note</i>: Documents have to be uploaded prior to confirming the final booking. Mandatory when shipping outside Europe.<br> <i>Note2</i>: When uploading a proforma invoice, it will overwrite proforma invoice that already exists on the shipment (if any).<br> <i>Note3</i>: Please download definition file for detailed informations.<br>'
      operationId: uploadDocumentDeprecated
      parameters:
      - name: dsv-service-auth
        in: header
        description: DSV XPress service auth for the selected API (found on DSV XPress API profile page)
        required: true
        schema:
          type: string
      - name: x-pat
        in: header
        description: DSV XPress personal access token (found on DSV XPress API profile page)
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - file
              - uploadDocumentRequest
              properties:
                file:
                  type: string
                  description: Data of the document to upload
                  format: binary
                uploadDocumentRequest:
                  $ref: '#/components/schemas/UploadDocumentRequest'
      responses:
        '200':
          description: successful operation. Return the document ID of the document uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadDocumentResponse'
              example:
                documentIdentificationNumber: 1012345678
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Shipment not found
        '415':
          description: Unsupported Media Type
    servers:
    - url: https://api.dsv.com/xp/booking/v2
