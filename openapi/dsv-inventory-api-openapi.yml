openapi: 3.2.0
info:
  title: WMS (DEMO) Inventory API
  description: 'Contract Logistics API - WMS Inventory (DEMO) '
  version: v1
servers:
- url: https://api.dsv.com/cl-demo/inventory/v1
security:
- apiKeyHeader: []
- apiKeyQuery: []
tags:
- name: Inventory
paths:
  /inventory/{warehouseId}:
    get:
      tags:
      - Inventory
      summary: Request a full inventory
      description: This message is sent by Client to DSV Warehouse to retrieve a full inventory report over Webhook
      operationId: Inventory_Get
      parameters:
      - name: warehouseId
        in: path
        required: true
        schema:
          type: string
      - name: api-version
        in: header
        description: api-version
        schema:
          type: string
        example: 1
      - name: Authorization
        in: header
        description: OAuth header
        schema:
          type: string
      responses:
        '200':
          description: Success
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              example:
                code: ERR12345
                message: 'Not found id : 4025988810785188'
                fields:
                - name: field_name
                  message: validation error
                  code: ERR12345
                development:
                  message: string
                  exception: string
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              example:
                code: ERR12345
                message: 'Not found id : 4025988810785188'
                fields:
                - name: field_name
                  message: validation error
                  code: ERR12345
                development:
                  message: string
                  exception: string
  /inventory/{warehouseId}/{productId}:
    get:
      tags:
      - Inventory
      summary: Get inventory by a single Product Id
      description: This message is sent by Client to DSV Warehouse to retrieve inventory report on a particular Product id.
      operationId: Inventory_Get2
      parameters:
      - name: warehouseId
        in: path
        required: true
        schema:
          type: string
      - name: productId
        in: path
        required: true
        schema:
          type: string
      - name: api-version
        in: header
        description: api-version
        schema:
          type: string
        example: 1
      - name: Authorization
        in: header
        description: OAuth header
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryByProductDto'
              example:
                warehouseId: 36643f9b7c1c48ef
                inventory:
                  productId: PId123
                  details:
                  - expirationDate: '2025-03-25'
                    lotId: '2025-03-25'
                    origin: AF
                    conditionOfProduct: OK1
                    quantities:
                      totalQuantity: 10
                      quantityReservedForOrders: 10
                    additionalInformation:
                      numericFields:
                      - sequence: 1
                        value: 999999999.999999
                      textFields:
                      - sequence: 1
                        value: Value1
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              example:
                code: ERR12345
                message: 'Not found id : 4025988810785188'
                fields:
                - name: field_name
                  message: validation error
                  code: ERR12345
                development:
                  message: string
                  exception: string
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              example:
                code: ERR12345
                message: 'Not found id : 4025988810785188'
                fields:
                - name: field_name
                  message: validation error
                  code: ERR12345
                development:
                  message: string
                  exception: string
components:
  schemas:
    TextFieldDto:
      required:
      - sequence
      type: object
      properties:
        sequence:
          maximum: 8.0
          minimum: 1.0
          type: integer
          description: User Def Type 1-8
          format: int32
          example: 1
        value:
          maxLength: 30
          minLength: 0
          type: string
          description: Max length 30 characters
          example: Value1
      description: User defined text fields
    DevelopmentDTO:
      type: object
      properties:
        message:
          type: string
          description: Verbose, plain language description of the problem for the app developer with hints on how to fix it
        exception:
          type: string
          description: Dump from exception
    ErrorDTO:
      required:
      - code
      - message
      type: object
      properties:
        code:
          minLength: 1
          type: string
          description: Unique error code
          example: ERR12345
        message:
          minLength: 1
          type: string
          description: Error message passed to the user
          example: 'Not found id : 4025988810785188'
