      enum:
      - OK1
      - OK2
      - DM1
      - DM2
      - HO1
      - HO2
      - QU1
      - QU2
      - RN1
      - RN2
      - SC1
      - SC2
      type: string
      description: ''
    NumericFieldDto:
      required:
      - sequence
      type: object
      properties:
        sequence:
          maximum: 4.0
          minimum: 1.0
          type: integer
          description: User Def Num 1-4
          format: int32
          example: 1
        value:
          maximum: 999999999.999999
          minimum: 0.0
          type: number
          description: 'min: 0, max: 999999999.999999 (9.6)'
          example: 999999999.999999
      description: User defined numeric fields
    QuantityDto:
      type: object
      properties:
        totalQuantity:
          maximum: 999999999.0
          minimum: 0.0
          type: integer
          description: Total stock quantity of OK1 condition subtracted allocated inventory
          format: int32
          example: 10
        quantityReservedForOrders:
          maximum: 999999999.0
          minimum: 0.0
          type: integer
          description: Allocated quantity
          format: int32
          example: 10
      description: Quantity Dto
    FieldDTO:
      type: object
      properties:
        name:
          type: string
          description: Error name
          example: field_name
        message:
          type: string
          description: Description of error
          example: validation error
        code:
          type: string
          description: Type of error
          example: ERR12345
    InventoryDto:
      type: object
      properties:
        productId:
          maxLength: 50
          minLength: 0
          type: string
          description: Stock Keeping Unit identifier
          example: PId123
        details:
          type: array
          items:
            $ref: '#/components/schemas/InventoryDetailsDto'
          description: Inventory Details
      description: Inventory
    InventoryByProductDto:
      required:
      - warehouseId
      type: object
      properties:
        warehouseId:
          maxLength: 20
          minLength: 0
          type: string
          description: To be resolved in Token database
          example: 36643f9b7c1c48ef
        inventory:
          $ref: '#/components/schemas/InventoryDto'
    InventoryDetailsDto:
      type: object
      properties:
        expirationDate:
          maxLength: 25
          minLength: 0
          type: string
          description: 'Expiry date Format: CCYY-MM-DD'
          example: '2025-03-25'
        lotId:
          maxLength: 20
          minLength: 0
          type: string
          description: Batch identifier
          example: '2025-03-25'
        origin:
          $ref: '#/components/schemas/CountryCode'
        conditionOfProduct:
          $ref: '#/components/schemas/ConditionCode'
        quantities:
          $ref: '#/components/schemas/QuantityDto'
        additionalInformation:
          $ref: '#/components/schemas/AdditionalInformationDto'
      description: InventoryDetailsDto
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      name: DSV-Subscription-Key
      in: header
    apiKeyQuery:
