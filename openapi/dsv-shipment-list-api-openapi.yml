    Delivery:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        contact:
          $ref: '#/components/schemas/ContactPerson'
      description: Name and address of the party where shipment is delivered
    Pickup:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        contact:
          $ref: '#/components/schemas/ContactPerson'
      description: Name and address of the party shipment is picked up.
    Sender:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        contact:
          $ref: '#/components/schemas/ContactPerson'
      description: 'Name and address of the party sending the goods (shipper).

        If address is not already available, it will be created from supplied address data.'
    ListParamsDTO:
      type: object
      properties:
        types:
          enum:
          - SENDER, RECEIVER, DOMESTIC, CROSS_TRADE
          type: array
          items:
            enum:
            - SENDER, RECEIVER, DOMESTIC, CROSS_TRADE
            type: string
            description: 'Only inlcude Bookings/Shipments where

              - SENDER - the sender is in the same country as I am.

              - RECEIVER - the receiver is in the same country as I am.

              - DOMESTIC - the sender and the receiver are in the same country as I am.

              - CROSS_TRADE - the sender and the receiver are in different countries as I am.'
          description: 'Only inlcude Bookings/Shipments where

            - SENDER - the sender is in the same country as I am.

            - RECEIVER - the receiver is in the same country as I am.

            - DOMESTIC - the sender and the receiver are in the same country as I am.

            - CROSS_TRADE - the sender and the receiver are in different countries as I am.'
        statuses:
          enum:
          - DRAFT, BOOKED, IN_PROGRESS, IN_TRANSIT, COMPLETED
          type: array
          items:
            enum:
            - DRAFT, BOOKED, IN_PROGRESS, IN_TRANSIT, COMPLETED
            type: string
            description: 'Only include Bookings/Shipments with this status:

              - DRAFT - Booking not yet submitted

              - BOOKED - Booking submitted, waiting for response from TMS

              - IN_PROGRESS - Shipment created but not yet moving

              - IN_TRANSIT - Shipment picked-up/cargo received, depending on the movement type.

              - COMPLETED - Shipment delivered / handed over at destination, depending on the movement type.

              - CANCELED - Shipment has been canceled

              - REJECTED - Booking was rejected'
          description: 'Only include Bookings/Shipments with this status:

            - DRAFT - Booking not yet submitted

            - BOOKED - Booking submitted, waiting for response from TMS

            - IN_PROGRESS - Shipment created but not yet moving

            - IN_TRANSIT - Shipment picked-up/cargo received, depending on the movement type.

            - COMPLETED - Shipment delivered / handed over at destination, depending on the movement type.

            - CANCELED - Shipment has been canceled

            - REJECTED - Booking was rejected'
        pickupDate:
          enum:
          - TOMORROW, TODAY, NEXT_WEEK, NEXT_MONTH, YESTERDAY, PAST_WEEK, PAST_MONTH
          type: string
          description: 'Only include Bookings/Shipments where the Pickup date (actual/estimated/requested) matches.

            - PAST_MONTH - Past 30 days

            - PAST_WEEK - Past 7 days

            - YESTERDAY - Yesterday

            - TODAY - Today

            - TOMORROW - Tomorrow

            - NEXT_WEEK - Next 7 days

            - NEXT_MONTH - Next 30 days'
        deliveryDate:
          enum:
          - TOMORROW, TODAY, NEXT_WEEK, NEXT_MONTH, YESTERDAY, PAST_WEEK, PAST_MONTH
          type: string
          description: 'Only include Bookings/Shipments where the Delivery date (actual/estimated/requested) matches.

            - PAST_MONTH - Past 30 days

            - PAST_WEEK - Past 7 days

            - YESTERDAY - Yesterday

            - TODAY - Today

            - TOMORROW - Tomorrow

            - NEXT_WEEK - Next 7 days

            - NEXT_MONTH - Next 30 days'
        transports:
          enum:
          - AIR, ROAD, SEA, RAIL
          type: array
          items:
            enum:
            - AIR, ROAD, SEA, RAIL
            type: string
            description: 'Only include Bookings/Shipments with this primary mode of transport:

              - AIR - Airfreight

              - ROAD - Roadfreight

              - SEA - Seafreight

              - RAIL - Railway

              - XPRESS - Express parcel shipments'
          description: 'Only include Bookings/Shipments with this primary mode of transport:

