openapi: 3.2.0
info:
  title: SCM Orders API
  description: test - Submit purchase orders to SCM and request updates via the Orders API\n
  version: v2
servers:
- url: https://api.dsv.com/om/v2
security:
- apiKeyHeader: []
- apiKeyQuery: []
tags:
- name: Orders
paths:
  /Orders/id/{id}:
    get:
      tags:
      - Orders
      summary: 6. Get order by guid/uuid.
      description: Get order by guid/uuid
      operationId: GETapi-public-v2-Orders-id-id
      parameters:
      - name: id
        in: path
        description: Format - uuid.
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        required: true
        schema:
          enum:
          - application/json
          type: string
      - name: Accept
        in: header
        required: true
        schema:
          enum:
          - application/json
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/eDC.Web.Api.v2.Models.OrderDto'
  /Orders/{orderNumber}/{splitNo}:
    get:
      tags:
      - Orders
      summary: 5. Get order by order number and split number
      description: Get order by order number and split number
      operationId: GETapi-public-v2-Orders-orderNumber-splitNo
      parameters:
      - name: orderNumber
        in: path
        required: true
        schema:
          type: string
      - name: splitNo
        in: path
        description: Format - int64.
        required: true
        schema:
          type: integer
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        required: true
        schema:
          enum:
          - application/json
          type: string
      - name: Accept
        in: header
        required: true
        schema:
          enum:
          - application/json
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/eDC.Web.Api.v2.Models.OrderDto'
    delete:
      tags:
      - Orders
      summary: 7. Delete order by order number and split number
      description: Delete order by order number and split number
      operationId: DELETEapi-public-v2-Orders-orderNumber-splitNo
      parameters:
      - name: orderNumber
        in: path
        required: true
        schema:
          type: string
      - name: splitNo
        in: path
        description: Format - int64.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
  /Orders/{orderNumber}:
    get:
      tags:
      - Orders
      summary: 4. Get orders by order number
      description: Get orders by order number
      operationId: GETapi-public-v2-Orders-orderNumber
      parameters:
      - name: orderNumber
        in: path
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        required: true
        schema:
          enum:
          - application/json
          type: string
      - name: Accept
        in: header
        required: true
        schema:
          enum:
          - application/json
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/eDC.Web.Api.v2.Models.OrderDto'
  /Orders:
    post:
      tags:
      - Orders
      summary: 1. Create Order(s)
      description: Create Order(s)
      operationId: POSTapi-public-v2-Orders
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        required: true
        schema:
          enum:
          - application/json
          type: string
      - name: Accept
        in: header
        required: true
        schema:
          enum:
          - application/json
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/eDC.Web.Api.v2.Models.OrderDto'
      responses:
        '200':
          description: Success
  /Orders/SearchCriteria:
    post:
      tags:
      - Orders
      summary: 3. Search for Orders by criteria
      description: Search for Orders by criteria
      operationId: POSTapi-public-v2-Orders-SearchCriteria
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        required: true
        schema:
          enum:
          - application/json
          type: string
      - name: Accept
        in: header
        required: true
        schema:
          enum:
          - application/json
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/eDC.Web.Api.v2.Models.Search.SearchRequest'
            example:
              grid:
                Page: 0
                PageSize: 0
                Sorts:
                - Member: string
                  SortDirection: Ascending
                Filters:
                - {}
                Groups:
                - MemberType: string
                  DisplayContent: {}
                  AggregateFunctions:
                  - AggregateMethodName: string
                    Caption: string
                    SourceField: string
                    FunctionName: string
                    MemberType: string
                    ResultFormatString: string
                  Member: string
                  SortDirection: Ascending
                Aggregates:
                - Aggregates:
                  - AggregateMethodName: string
                    Caption: string
                    SourceField: string
                    FunctionName: string
                    MemberType: string
                    ResultFormatString: string
                  Member: string
              criteria: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/eDC.Web.Api.v2.Models.OrderDto'
  /api/public/v2/Orders/ProcessOrderEDI:
    post:
      tags:
      - Orders
      summary: 8. ProcessOrderEDI
      description: ProcessOrderEDI
      operationId: POSTapi-public-v2-Orders-ProcessOrderEDI
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        required: true
        schema:
          enum:
          - application/json
          type: string
      - name: Accept
        in: header
        required: true
        schema:
          enum:
          - application/json
          type: string
      responses:
        '200':
          description: Success
