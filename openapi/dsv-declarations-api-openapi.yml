          description: Total value stated in the commercial invoice.
          format: double
        invoiceCurrency:
          type:
          - string
          - 'null'
          description: Currency as shown on the commercial invoice.
      description: Commercial invoice associated with the customs declaration.
    HolderOfAuthorization:
      type:
      - object
      - 'null'
      properties:
        type:
          type:
          - string
          - 'null'
          description: Code specifying the type of person being the holder of the authorization (e.g., AEO, customs warehousing).
        reference:
          type:
          - string
          - 'null'
          description: Authorization number.
      description: Entity holding a specific customs authorization.
    Parties:
      type:
      - object
      - 'null'
      properties:
        broker:
          allOf:
          - $ref: '#/components/schemas/Party'
          - description: The entity authorized to act on behalf of another in customs matters, typically facilitating the submission of declarations and ensuring compliance with customs regulations.
        ior:
          allOf:
          - $ref: '#/components/schemas/Party'
          - description: The entity (Importer of Record) legally responsible for ensuring that imported goods comply with local laws and regulations, including payment of duties and taxes.
        eor:
          allOf:
          - $ref: '#/components/schemas/Party'
          - description: The entity (Exporter of Record) responsible for ensuring that goods exported from a country comply with export regulations, including documentation and licensing.
        consignee:
          allOf:
          - $ref: '#/components/schemas/Party'
          - description: Ultimate consignee in case it is different from IOR. The Ultimate Consignee is the last recipient of a shipment.
        declarant:
          allOf:
          - $ref: '#/components/schemas/Party'
          - description: Details related to the party who makes a declaration to an official body or - where legally permitted - in whose name, or on whose behalf, a declaration to an official body is made.
        representative:
          allOf:
          - $ref: '#/components/schemas/Party'
          - description: Details related to the entity acting as a representative.
        buyer:
          allOf:
          - $ref: '#/components/schemas/Party'
          - description: Details related to the party to which merchandise or services are sold.
        seller:
          allOf:
          - $ref: '#/components/schemas/Party'
          - description: Details related to the party selling merchandise to a buyer.
        authorizedConsignee:
          allOf:
          - $ref: '#/components/schemas/Party'
          - description: Entity authorized by the customs administration to receive goods directly at their premises without presenting them at the customs office at the point of destination.
        forwarder:
          allOf:
          - $ref: '#/components/schemas/Party'
          - description: A logistics provider responsible for organizing the transportation of goods, often acting as an intermediary between shipper and carrier.
        carrier:
          allOf:
          - $ref: '#/components/schemas/Party'
          - description: The party responsible for physically transporting the goods, such as a shipping line, airline, or trucking company.
        shipper:
          allOf:
          - $ref: '#/components/schemas/Party'
          - description: The party initiating the shipment, typically the seller or consignor.
        delivery:
          allOf:
          - $ref: '#/components/schemas/Party'
          - description: Party to which goods should be or have been delivered or positioned.
        intermediateConsignee:
          allOf:
          - $ref: '#/components/schemas/Party'
          - description: A party, other than the final consignee, that is designated to receive, hold, or forward the goods at an intermediate stage of the supply chain before they reach their final destination.
      description: A collection of all parties involved in the customs declaration and the associated shipment. Each party represents a distinct role in the trade or logistics chain, such as the broker, importer, exporter, carrier, or consignee.
    Address:
      type:
      - object
      - 'null'
      properties:
        name1:
          type:
          - string
          - 'null'
          description: First line of the party's address.
        name2:
          type:
          - string
          - 'null'
          description: Second line of the party's address.
        name3:
          type:
          - string
          - 'null'
          description: Third line of the party's address.
        name4:
          type:
          - string
          - 'null'
          description: Fourth line of the party's address.
        city:
          type:
          - string
          - 'null'
          description: Name of the city.
        postalCode:
          type:
          - string
          - 'null'
          description: Postal or ZIP code of the party's address.
        state:
          type:
          - string
          - 'null'
          description: The name or code of the state, province, region, or other sub-national administrative division.
        country:
          type:
          - string
          - 'null'
          description: ISO 3166-1 alpha-2 country code representing the country of registration or operation of the party.
      description: Physical or registered address of a party involved in the customs declaration. Supports up to four address lines to accommodate varying international address formats.
    TaxLine:
      type:
      - object
      - 'null'
      properties:
        type:
          type:
          - string
          - 'null'
          description: Classification used in customs declarations to identify which kind of tax is being charged.
        base:
          type:
          - number
          - 'null'
          description: Value or quantity on which the tax is calculated.
          format: double
        rate:
          type:
          - number
          - 'null'
          description: Percentage or fixed amount applied to the tax base to calculate the total tax or duty owed on imported or exported goods.
          format: double
        payableAmount:
          type:
          - number
          - 'null'
          description: Final calculated amount of taxes and duties due to customs authorities based on the declared value, applicable tax rates, and other charges.
          format: double
        paymentMethod:
          type:
          - string
          - 'null'
          description: The way or mode by which duties, taxes, and fees are paid to customs authorities during the import or export process.
      description: Classification and amount details for a specific tax or duty applied at line level.
    AdditionalDocumentLine:
      type:
      - object
      - 'null'
      properties:
        type:
          type:
          - string
          - 'null'
          description: Type of document used related to the declaration line.
        amount:
          type:
          - number
          - 'null'
          description: Value related to the document type.
          format: double
        reference:
          type:
          - string
          - 'null'
          description: Unique identifier or number assigned to an additional supporting document related to a specific item in a customs declaration.
        issueDate:
          type:
          - string
          - 'null'
          description: Date on which the supplementary customs document (e.g., certificate of origin, inspection certificate, license, or permit) was officially issued by the relevant authority or issuer.
        validityDate:
          type:
          - string
          - 'null'
          description: The last date on which the additional document remains effective and valid for customs use.
      description: Extra document related to a specific line item that supports or clarifies the declaration.
