  /declarations/{id}:
    get:
      tags:
      - Declarations
      summary: Get draft customs declaration by ID
      description: 'Allows customers to retrieve draft customs declarations prepared by DSV.


        Use case:

        This API enables customers to access draft declarations created by DSV in Customs AI platform for pre-clearance audit and validation purposes.


        Customers can retrieve only those draft declarations that are linked to their unique customer identifier (ID64…) and associated with a specific Shipment ID within the relevant transport management system.

        '
      operationId: 01-get-declarations-id
      parameters:
      - name: id
        in: path
        description: Declaration identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Declaration found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomsDeclarationEnvelope'
              example:
                id: string
                declaration:
                  header:
                    entryNumber: string
                    lrn: string
                    ucr: string
                    jobDate: string
                    jobTime: string
                    jobType: StandardImport
                    jobTypeDescription: string
                    shipmentType: string
                    declarationType: string
                    declarationCategory: string
                    declarationCountry: string
                    declarationDivision: Air
                    portOfEntry: string
                    cityOfEntry: string
                    countryOfImport: string
                    countryOfExport: string
                    portOfLoading: string
                    portOfDischarge: string
                    borderTransportId: string
                    inlandTransportId: string
                    borderModeOfTransport: string
                    inlandModeOfTransport: string
