components:
  schemas:
    TotalGuarantee:
      type:
      - object
      - 'null'
      properties:
        value:
          type:
          - number
          - 'null'
          description: Total guarantee amount from the declaration.
          format: double
        currency:
          type:
          - string
          - 'null'
          description: Currency of the guarantee amount from the declaration.
        type:
          type:
          - string
          - 'null'
          description: Specifies the nature of the guarantee provided (e.g., cash deposit, bond).
        number:
          type:
          - string
          - 'null'
          description: Unique reference or identification number assigned to the guarantee.
      description: Financial security provided to Customs to ensure payment of duties, taxes, or compliance with customs procedures.
    Guarantee:
      type:
      - object
      - 'null'
      properties:
        value:
          type:
          - number
          - 'null'
          description: Guarantee amount per line from the declaration.
          format: double
        currency:
          type:
          - string
          - 'null'
          description: Original currency of the guarantee value.
        reference:
          type:
          - string
          - 'null'
          description: Unique reference or identification number assigned to the guarantee.
        type:
          type:
          - string
          - 'null'
          description: Specifies the nature of the guarantee provided (e.g., cash deposit, bond).
        exchangeRate:
          type:
          - number
          - 'null'
          description: Exchange rate used to convert from foreign currency into local currency.
          format: double
        convertedValue:
          type:
          - number
          - 'null'
          description: Converted guarantee amount in local currency.
          format: double
        convertedValueCurrency:
          type:
          - string
          - 'null'
          description: Currency of the converted guarantee amount on line level.
      description: Financial security provided to Customs at line level.
    AdditionalInformationLine:
      type:
      - object
      - 'null'
      properties:
        code:
          type:
          - string
          - 'null'
          description: Categories or classifications of extra details that can be added to each item in a customs declaration to provide more context or specify certain conditions.
        information:
          type:
          - string
          - 'null'
          description: Specific code or identifier that refers to the kind of additional information provided for an item in a customs declaration.
      description: Supplementary data related to a specific item in the customs declaration.
    Party:
      type:
      - object
      - 'null'
      properties:
        registrationCode:
          type:
          - string
          - 'null'
          description: Party's legal reference number (e.g., EORI number, Importer ID, Exporter ID).
        vatGst:
          type:
          - string
          - 'null'
          description: VAT / Tax Identifier of the party.
        name:
          type:
          - string
          - 'null'
          description: Full legal name of the party.
        address:
          $ref: '#/components/schemas/Address'
        representativeStatus:
          type:
          - string
          - 'null'
          description: Representational relationship type (e.g., direct or indirect representation).
    PreviousDocumentLine:
      type:
      - object
      - 'null'
      properties:
        reference:
          type:
          - string
          - 'null'
          description: Previously used customs document number.
        category:
          type:
          - string
          - 'null'
          description: Type or classification of the earlier document linked to a specific item in the customs declaration.
        type:
          type:
          - string
          - 'null'
          description: More specific classification or code that identifies the exact kind of prior document linked to an individual item in a customs declaration.
      description: Reference to a document related to or supporting a specific item in the shipment.
    AdditionsAndDeductionsLine:
      type:
      - object
      - 'null'
      properties:
        code:
          type:
          - string
          - 'null'
          description: Standardized numerical or alphanumeric codes used to specify the type of adjustment made to the item value — whether it is an addition or deduction — to ensure clarity and uniformity in declarations.
        value:
          type:
          - number
          - 'null'
          description: Monetary value that is either added to or subtracted from the declared value of an item to calculate the correct customs value.
          format: double
        currency:
          type:
          - string
          - 'null'
          description: Currency unit in which the amounts for additions or deductions are expressed.
        exchangeRate:
          type:
          - number
          - 'null'
          description: Exchange rate for currency used for additions or deductions.
          format: double
        convertedValue:
          type:
          - number
          - 'null'
          description: Converted value that is either added to or subtracted from the declared value of an item.
          format: double
      description: Costs or amounts added to or subtracted from the value of the goods to calculate the total customs value at line level.
    AdditionalDocument:
      type:
      - object
      - 'null'
      properties:
        type:
          type:
          - string
          - 'null'
          description: Type of document (e.g., certificate of origin).
        reference:
          type:
          - string
          - 'null'
          description: Document number or identifier.
        amount:
          type:
          - number
          - 'null'
          description: Value related to the document type.
          format: double
        issueDate:
          type:
          - string
          - 'null'
          description: Date on which the supplementary customs document was officially issued by the relevant authority or issuer.
        validityDate:
          type:
          - string
          - 'null'
          description: The last date on which the additional document remains effective and valid for customs use.
      description: Document supporting the customs declaration at header level.
    Declaration:
      type:
      - object
      - 'null'
      properties:
        header:
          $ref: '#/components/schemas/Header'
        lines:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Line'
          description: List of line items in the declaration.
        commercialInvoice:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CommercialInvoice'
          description: List of Commercial invoices associated with the customs declaration.
        commercialInvoiceLine:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CommercialInvoiceLine'
          description: List of individual line items of a commercial invoice.
        additionalNotes:
          type:
          - string
          - 'null'
          description: A free-text field used to capture any supplementary comments or contextual information that applies to the overall customs declaration. This field is intended for general remarks that do not relate to a specific data element, item line, or section of the declaration.
      description: The full customs declaration object containing header, line items, invoices, and additional notes.
    Tax:
      type:
      - object
      - 'null'
      properties:
        type:
          type:
          - string
          - 'null'
          description: Type of tax (e.g., VAT, customs duty).
        base:
          type:
          - number
          - 'null'
          description: Value on which the tax is calculated.
          format: double
        rate:
          type:
          - number
          - 'null'
          description: Applicable tax rate.
          format: double
        payableAmount:
          type:
          - number
          - 'null'
          description: Tax amount due.
          format: double
        total:
          type:
          - number
          - 'null'
          description: Total of all taxes.
          format: double
        paymentMethod:
          type:
          - string
          - 'null'
          description: Method used to pay taxes.
      description: Duty and tax details at header level.
    CustomsDeclarationEnvelope:
      type:
      - object
      - 'null'
      properties:
        id:
          type:
          - string
          - 'null'
          description: Unique identifier of the customs declaration.
        declaration:
          $ref: '#/components/schemas/Declaration'
    AdditionalCodeLine:
      type:
      - object
      - 'null'
      properties:
        code:
          type:
          - string
          - 'null'
          description: Secondary HS code required to be declared by customs authority due to the kind of commodity being imported and any additionally applied duties.
      description: Secondary HS code required by customs authority for certain commodities (e.g., Section 301 duties for goods from CN).
    CommercialInvoiceLine:
      type:
      - object
      - 'null'
      properties:
        partNumber:
          type:
          - string
          - 'null'
          description: Customer commodity reference (e.g., ASIN, Apple part number) representing the commodity for this line.
        partNumberDescription:
          type:
          - string
          - 'null'
          description: Description of the commodity reference representing the commodity for this line.
        commercialInvoiceNumber:
          type:
          - string
          - 'null'
          description: Reference to the commercial invoice this line belongs to.
        commercialInvoiceLineNumber:
          type:
          - integer
          - 'null'
          description: Line item position number in the commercial invoice.
        commercialInvoiceLineItemQuantity:
          type:
          - integer
          - 'null'
          description: Number of pieces at each part number level.
        commercialInvoiceNumberOfPackages:
          type:
          - integer
          - 'null'
          description: Number of units for the part number as listed on the commercial invoice.
        commercialInvoicePackageType:
          type:
          - string
          - 'null'
          description: Package type as listed on the commercial invoice line.
        commercialInvoiceGrossWeight:
          type:
          - number
          - 'null'
          description: Total gross weight amount of the invoice line.
          format: double
        commercialInvoiceGrossWeightUom:
          type:
          - string
          - 'null'
          description: Gross weight unit of measure of the invoice line.
        commercialInvoiceNetWeight:
          type:
          - number
          - 'null'
          description: Net weight amount of the invoice line.
          format: double
        commercialInvoiceNetWeightUom:
          type:
          - string
          - 'null'
          description: Net weight unit of measure of the invoice line.
        commercialInvoiceLinePrice:
          type:
          - number
          - 'null'
          description: Price of a single line on the invoice — unit price multiplied by quantity.
          format: double
        unitPriceOfCommercialInvoiceLineItem:
          type:
          - number
          - 'null'
          description: Unit price of an item being imported as stated on the commercial invoice.
          format: double
      description: Individual line item of a commercial invoice.
    AdditionalInformation:
      type:
      - object
      - 'null'
      properties:
        type:
          type:
          - string
          - 'null'
          description: Code indicating the nature of the additional information.
        reference:
          type:
          - string
          - 'null'
          description: Identifier or description of the information.
      description: Supplementary data required for customs at header level.
    Line:
      type:
      - object
      - 'null'
      properties:
        lineNumber:
          type:
          - integer
          - 'null'
          description: The line number as presented in the actual Entry filing.
        commercialInvoiceNumber:
          type:
          - string
          - 'null'
          description: Reference to the commercial invoice associated with this line.
        htsCode:
          type:
          - string
          - 'null'
          description: The HTS classification code for this line.
        htsDescription:
          type:
          - string
          - 'null'
          description: Description of the HTS classification for this line.
        additionalCodes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AdditionalCodeLine'
          description: Secondary HS codes required by customs authority, e.g., for Section 301 duties on goods with country of origin CN.
        htsQuantity:
          type:
          - integer
          - 'null'
          description: Declared number of goods based on the HTS code level.
        countryOfOrigin:
          type:
          - string
          - 'null'
          description: 2-letter ISO country code for the country of origin of this line.
        grossWeight:
          type:
          - number
          - 'null'
          description: Gross weight amount at HS code level.
          format: double
        grossWeightUom:
          type:
          - string
          - 'null'
          description: Gross weight unit of measure at HS code level.
        netWeight:
          type:
          - number
          - 'null'
          description: Net weight amount at HS code level.
          format: double
        netWeightUom:
          type:
          - string
          - 'null'
          description: Net weight unit of measure at HS code level.
        htsLineValue:
          type:
          - number
          - 'null'
          description: Invoice value of goods at HS code level.
          format: double
        htsLineCurrency:
          type:
          - string
          - 'null'
          description: Total amount currency at HS code level.
        packageType:
          type:
          - string
          - 'null'
          description: Package type related to the HS Code Line.
        numberOfPackages:
          type:
          - number
          - 'null'
          description: Number of packages per HS Code Line.
          format: double
        packageMarks:
          type:
          - string
          - 'null'
          description: Identifying marks on packages.
        supplementaryUnits:
          type:
          - integer
          - 'null'
          description: Additional units of measurement used to describe the quantity of goods beyond the primary unit.
        supplementaryUnitsOfMeasure:
          type:
          - string
          - 'null'
          description: Measures of supplementary units (e.g., LTR, KG).
        additionalDocuments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AdditionalDocumentLine'
          description: Extra documents related to a specific item that support or clarify the declaration.
        additionalInformation:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AdditionalInformationLine'
          description: Supplementary data related to a specific item in the customs declaration.
        quota:
          type:
          - string
          - 'null'
          description: Government-imposed limit on the quantity or value of certain goods that can be imported or exported during a specific period.
        taxes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TaxLine'
          description: Specific types of tax or duty applied to imported or exported goods at line level.
        dutyLineBaseValue:
          type:
          - number
          - 'null'
          description: Customs Value / CIF Value (including freight and insurance costs plus HS line value); basis amount that will be multiplied with a percentage of HS code.
          format: double
        dutyLinePayableAmount:
          type:
          - number
          - 'null'
          description: The duty paid for the goods on this line in the currency of the customs declaration.
          format: double
        dutyLineRate:
          type:
          - number
          - 'null'
          description: Duty rate percentage based on HS code as set by customs.
          format: double
        taxLineBaseValue:
          type:
          - number
          - 'null'
          description: Basis amount that will be multiplied with a percentage of tax rate. Import Duty Value + Duties paid amount = Import Tax Value Amount.
          format: double
        taxLinePayableAmount:
          type:
          - number
          - 'null'
          description: Import/export tax value paid for the goods on this line in the currency of the customs declaration. E.g. VAT (GST).
          format: double
        taxLineRate:
          type:
          - number
          - 'null'
          description: Tax rate percentage based on HS code as set by customs.
          format: double
        postponedVatLineValue:
          type:
          - number
          - 'null'
          description: Postponed VAT amount for declaration.
          format: double
        postponedVatLineCurrency:
          type:
          - string
          - 'null'
          description: Postponed VAT currency for declaration.
        consumptionTaxLinePayableAmount:
          type:
          - number
          - 'null'
          description: Consumption tax paid for the goods on this line in the currency of the customs declaration.
          format: double
        consumptionTaxLineRate:
          type:
          - integer
          - 'null'
          description: Consumption tax rate percentage based on HS code as set by customs.
        antidumpingLinePayableAmount:
          type:
          - number
          - 'null'
          description: Antidumping duty paid for the goods on this line in the currency of the customs declaration.
          format: double
        antidumpingLineRate:
          type:
          - number
          - 'null'
          description: Antidumping duty rate percentage based on HS code as set by customs.
          format: double
        antidumpingLineCaseNumber:
          type:
          - string
          - 'null'
          description: Antidumping Duty Case Number reported to Customs.
        countervailingLinePayableAmount:
          type:
          - number
          - 'null'
          description: The countervailing duty paid for the goods on this line in the currency of the customs declaration.
          format: double
        countervailingLineRate:
          type:
          - number
          - 'null'
          description: Countervailing duty rate percentage based on HS code as set by customs.
          format: double
        countervailingLineCaseNumber:
          type:
          - string
          - 'null'
          description: Countervailing Duty Case Number reported to Customs.
